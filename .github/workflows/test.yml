name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependencies to install: the suite runs on node:test.
      - name: Run tests
        run: npm test

      # The pre-commit hook only protects local commits. Running the same
      # check here catches anything pushed with --no-verify, or committed
      # before the hook was installed.
      - name: Privacy check
        run: bash .githooks/pre-commit --all
